# Every push to `development` and every pull request that targets `development`
# or `main` runs the same gate the release train relies on. There is no publish
# job anywhere in this repository on purpose: the plugin is installed from a
# local path or a tarball, never from the npm registry.
name: verify

on:
  push:
    branches: [development]
  pull_request:
    branches: [development, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify

  # Pulling into `main` is how this repository releases, so the pull request has
  # to carry the version bump. Without this job that rule is a convention; with
  # it, a merge that forgets the bump fails before it can land.
  version-bump:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: BASE_REF=origin/${{ github.base_ref }} node scripts/check-version-bump.mjs
